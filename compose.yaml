# IMBC Platform — полный dev-стенд одной командой: `docker compose up -d --build`.
# Состав повторяет архитектуру v0.4 (§6): без Kafka — очередь pg-boss живёт в PostgreSQL (ADR-06),
# Valkey только кеш (ADR-11), файлы — S3-совместимое хранилище (RustFS), вход — Keycloak (ADR-04).
# Все параметры — в .env (шаблон: .env.example).

name: imbc

x-backend-env: &backend-env
  NODE_ENV: production
  DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
  DEV_FIXED_OTP_ENABLED: ${DEV_FIXED_OTP_ENABLED:-false}
  DEV_FIXED_OTP_USER_ID: ${DEV_FIXED_OTP_USER_ID:-}
  DEV_FIXED_OTP_ACCOUNTS: ${DEV_FIXED_OTP_ACCOUNTS:-[]}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_URL: ${PUBLIC_URL}
  DATABASE_URL: postgres://imbc_app:${DB_APP_PASSWORD}@postgres:5432/imbc
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: http://rustfs:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  OIDC_ISSUER: ${PUBLIC_URL}/kc/realms/imbc
  OIDC_INTERNAL_URL: http://keycloak:8080
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-imbc-session}
  DEVICE_COOKIE_NAME: ${DEVICE_COOKIE_NAME:-imbc-device}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-IMBC Platform <no-reply@imbc.local>}
  IMBC_MAILBOX: ${IMBC_MAILBOX:-platform@imbc.local}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310

services:
  # ── Данные ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imbc
      POSTGRES_USER: imbc
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: UTC
    volumes:
      # PostgreSQL 18: том монтируется в /var/lib/postgresql (данные — в подкаталоге версии).
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imbc -d imbc"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Только кеш: без снапшотов и AOF, вытеснение LRU (ADR-11).
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RustFS работает под uid 10001: том данных должен принадлежать ему (рекомендация документации RustFS).
  rustfs-perms:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data
    restart: "no"

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    depends_on:
      rustfs-perms: { condition: service_completed_successfully }
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - rustfs-data:/data
    ports:
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"

  # Бакеты: карантин → проверка ClamAV → рабочий; отдельный — для файлов выгрузок (архитектура §7).
  buckets:
    image: amazon/aws-cli:latest
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export AWS_MAX_ATTEMPTS=1
        s3api() {
          aws --endpoint-url http://rustfs:9000 --cli-connect-timeout 5 --cli-read-timeout 5 s3api "$$@"
        }
        ready=false
        for i in $$(seq 1 60); do
          if s3api list-buckets >/dev/null 2>&1; then ready=true; break; fi
          sleep 2
        done
        if [ "$$ready" != true ]; then
          echo "RustFS did not become ready" >&2
          exit 1
        fi
        for b in imbc-quarantine imbc-files imbc-exports; do
          s3api head-bucket --bucket "$$b" 2>/dev/null \
            || s3api create-bucket --bucket "$$b"
        done
        echo "buckets ready"
    restart: "no"

  # ── Платформенные сервисы ─────────────────────────────────────────────────
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /kc
      KC_HOSTNAME: ${PUBLIC_URL}/kc
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Подстановки в infrastructure/keycloak/imbc-realm.json
      KEYCLOAK_SSL_REQUIRED: ${KEYCLOAK_SSL_REQUIRED:-external}
      PUBLIC_URL: ${PUBLIC_URL}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD}
      KEYCLOAK_LOGIN_THEME: ${KEYCLOAK_LOGIN_THEME:-keycloak.v2}
      # Почта Keycloak: письма установки и сброса пароля (AUTH-01, AUTH-08). По умолчанию — Mailpit.
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-mailpit}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-1025}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-no-reply@imbc.local}
      KEYCLOAK_SMTP_REPLY_TO: ${KEYCLOAK_SMTP_REPLY_TO:-}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-false}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-false}
    volumes:
      - ./infrastructure/keycloak/imbc-realm.json:/opt/keycloak/data/import/imbc-realm.json:ro
    healthcheck:
      # В образе Keycloak нет curl: запрос к management-порту через /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /kc/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Проверку файлов вызывает только worker (DATA-07): поток INSTREAM — не больше 25 МБ (MAX_FILE_BYTES, 26 214 400 байт).
  # Пределы clamd — значения образа по умолчанию (ClamAV 1.x: StreamMaxLength и MaxFileSize 100M, MaxScanSize 400M),
  # все не меньше 25 МБ; проверить на стенде: `docker compose exec clamav clamconf | grep -iE 'StreamMaxLength|MaxFileSize'`.
  # Ответ clamd, кроме OK и FOUND (например, «INSTREAM size limit exceeded. ERROR»), — ошибка задания, не «чистый».
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s   # первая загрузка сигнатур занимает несколько минут

  # Почтовый сервис dev-стенда: принимает SMTP от api, worker и Keycloak и ничего не отправляет наружу.
  # Коды входа, письма установки пароля и уведомления читаются в веб-интерфейсе Mailpit.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}     # "user:password" — закрыть интерфейс паролем на общем стенде
    volumes:
      - mailpit-data:/data
    command: ["--database", "/data/mailpit.db"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # все письма платформы и Keycloak на dev-стенде

  # ── Приложение ────────────────────────────────────────────────────────────
  migrate:
    build: &api-build
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26}
    image: imbc/api:${IMAGE_TAG:-dev}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://imbc:${DB_OWNER_PASSWORD}@postgres:5432/imbc
      DB_APP_ROLE: imbc_app
      SEED_DEMO: ${SEED_DEMO:-true}
    command:
      - /bin/sh
      - -c
      - node dist/database/migrate.js && if [ "$$SEED_DEMO" = "true" ]; then node dist/database/seed.js; fi
    restart: "no"

  api:
    image: imbc/api:${IMAGE_TAG:-dev}
    build: *api-build
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    environment:
      <<: *backend-env
      PROCESS_ROLE: api
      PORT: 3001
    depends_on:
      migrate: { condition: service_completed_successfully }
      buckets: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    image: imbc/api:${IMAGE_TAG:-dev}
    build: *api-build
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *backend-env
      PROCESS_ROLE: worker
      WORKER_HEALTH_PORT: 3002
      # Adata (EXT-02, IMBC-07): токен только у worker, API его не получает. Пусто — чтение выключено.
      ADATA_API_TOKEN: ${ADATA_API_TOKEN:-}
      ADATA_MONTHLY_LIMIT: ${ADATA_MONTHLY_LIMIT:-3000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      buckets: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8

  web:
    image: imbc/web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26}
    restart: unless-stopped
    depends_on: [api]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mailpit-data:
  postgres-data:
  rustfs-data:
  clamav-db:
