#cloud-config
# Ubuntu 24.04 → Docker Engine + Compose v2 (официальный репозиторий Docker) для dev-стенда IMBC.
package_update: true
packages: [ca-certificates, curl, make, openssl, unzip]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker ${ADMIN_USER}
  - echo 'vm.max_map_count=262144' > /etc/sysctl.d/99-imbc.conf && sysctl --system
