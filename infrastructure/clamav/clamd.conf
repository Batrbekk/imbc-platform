# clamd для проверки файлов платформы (DATA-07). Монтируется в /etc/clamav/clamd.conf сервиса clamav (compose.yaml)
# только для чтения и заменяет файл образа clamav/clamav:1.4 целиком: первые пять настроек — действующие строки
# файла образа, без изменений; остальные — пределы проверки платформы. Файл смонтирован как файл: после правки
# контейнер clamav нужно пересоздать (`docker compose up -d --force-recreate clamav`).
#
# Пределы clamd считаются по распакованному содержимому: DOCX и XLSX — ZIP, сжатые потоки PDF clamd тоже
# распаковывает. Файл платформы не больше 25 МБ (MAX_FILE_BYTES = 26 214 400 байт), но распакованным может быть
# во много раз больше.

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# DATA-07: превышение любого предела проверки (MaxScanSize, MaxFileSize, MaxRecursion, MaxFiles и других) — не «OK»
# по непроверенному остатку, а «FOUND Heuristics.Limits.Exceeded…»: worker отклоняет такой файл (rejected, аудит
# file.scan_rejected с сигнатурой). Без этой строки clamd молча прекращает проверку и отвечает «OK».
AlertExceedsMax yes

# DATA-07: сколько распакованных данных одного входного файла проверяется (по умолчанию 400M). Больше — отказ
# по AlertExceedsMax.
MaxScanSize 1024M

# DATA-07: самый большой проверяемый файл, в том числе вложенный в архив или документ (по умолчанию 100M).
# Не меньше StreamMaxLength: входной поток целиком всегда проверяется.
MaxFileSize 512M

# DATA-07: самый большой поток INSTREAM, который принимает clamd (по умолчанию 100M). Не меньше 25 МБ
# (MAX_FILE_BYTES): больше worker не передаёт; ответ «INSTREAM size limit exceeded. ERROR» — ошибка задания.
StreamMaxLength 100M
