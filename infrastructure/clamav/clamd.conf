# clamd для проверки файлов платформы (DATA-07). Монтируется в /etc/clamav/clamd.conf сервиса clamav (compose.yaml)
# только для чтения и заменяет файл образа clamav/clamav:1.4 целиком: первые пять настроек — действующие строки
# файла образа, без изменений; остальные — пределы проверки платформы. Файл смонтирован как файл: после правки
# контейнер clamav нужно пересоздать (`docker compose up -d --force-recreate clamav`).
#
# Пределы clamd считаются по распакованному содержимому: DOCX и XLSX — ZIP, сжатые потоки PDF clamd тоже
# распаковывает. Файл платформы не больше 25 МБ (MAX_FILE_BYTES = 26 214 400 байт), но распакованным может быть
# во много раз больше. Записи ZIP64 ClamAV 1.4 не разбирает и отвечает по ним «OK», а при сброшенном бите 3 читает
# размеры и метод из локального заголовка, тогда как Office — из центрального каталога. Такие DOCX и XLSX (ZIP64,
# расхождение локального заголовка с каталогом, комментарий архива) платформа отклоняет ещё при загрузке
# (apps/api/src/modules/files/zip-structure.ts, 415 file_structure_unsupported).
#
# Своя база сигнатур платформы — infrastructure/clamav/imbc.ndb (формат .ndb комментариев не допускает, пояснение —
# здесь и в compose.yaml). Две сигнатуры тела IMBC.Unverifiable.Zip64LocalHeader-1 и -2: локальный заголовок ZIP
# (PK\x03\x04), у которого сжатый (смещение 18) или несжатый (смещение 22) размер равен 0xFFFFFFFF. Такой архив
# clamd 1.4 не разбирает и признаёт чистым на любой глубине — во вложенном пакете, в потоке объекта OLE, во вложении
# PDF; при этом сам распаковывает эти контейнеры и применяет сигнатуры тела к каждому извлечённому объекту. clamd
# сообщает имя с суффиксом .UNOFFICIAL, worker отклоняет файл с причиной scan_limits (DATA-07). Каталог баз —
# по умолчанию /var/lib/clamav: файл копируется туда при старте контейнера (entrypoint сервиса clamav в compose.yaml).

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# DATA-07: превышение любого предела проверки (MaxScanSize, MaxFileSize, MaxRecursion, MaxFiles и других) — не «OK»
# по непроверенному остатку, а «FOUND Heuristics.Limits.Exceeded…»: worker отклоняет такой файл (rejected, аудит
# file.scan_rejected с сигнатурой). Без этой строки clamd молча прекращает проверку и отвечает «OK».
AlertExceedsMax yes

# DATA-07: сколько распакованных данных одного входного файла проверяется (по умолчанию 400M). Больше — отказ
# по AlertExceedsMax.
MaxScanSize 1024M

# DATA-07: самый большой проверяемый файл, в том числе вложенный в архив или документ (по умолчанию 100M).
# Не меньше StreamMaxLength: входной поток целиком всегда проверяется.
MaxFileSize 512M

# DATA-07: предел времени проверки одного файла в миллисекундах — значение по умолчанию, задано явно. Превышение
# при AlertExceedsMax yes — «FOUND Heuristics.Limits.Exceeded.MaxScanTime»: файл отклоняется. Таймаут клиента clamd
# в worker (CLAMD_CLIENT_TIMEOUT_MS, apps/api/src/worker/clamd.ts) заметно больше: решение принимает clamd, а не
# обрыв соединения.
MaxScanTime 120000

# DATA-07: самый большой поток INSTREAM, который принимает clamd (по умолчанию 100M). Не меньше 25 МБ
# (MAX_FILE_BYTES): больше worker не передаёт; ответ «INSTREAM size limit exceeded. ERROR» — ошибка задания.
StreamMaxLength 100M

# DATA-07, вопрос 54: документ под паролем не проверить — отказ. PDF с паролем на открытие, документ Office или
# OLE2 под паролем — «FOUND Heuristics.Encrypted.PDF» (…OLE2 и т. п.): worker отклоняет файл с причиной encrypted.
# PDF только с паролем прав (печать, правка) открывается без пароля: clamd расшифровывает его сам и проверяет,
# отказа нет. DOCX и XLSX под паролем платформа отклоняет ещё при загрузке (415 file_encrypted).
AlertEncryptedDoc yes

# DATA-07, вопрос 54: архив под паролем не проверить — отказ. ZIP, RAR и другие архивы под паролем, в том числе
# вложенные в документ, — «FOUND Heuristics.Encrypted.Zip» (…RAR и т. п.), причина encrypted.
AlertEncryptedArchive yes
