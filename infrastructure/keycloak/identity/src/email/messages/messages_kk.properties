executeActionsSubject=IMBC платформасы: құпиясөзді орнатыңыз
executeActionsBody=IMBC платформасында осы электрондық пошта мекенжайына арналған тіркелгі бар. Кіру үшін төмендегі сілтеме арқылы құпиясөзді орнатыңыз.\n\n{0}\n\nСілтеме {4} бойы жарамды. Құпиясөз электрондық пошта арқылы жіберілмейді.\n\nЕгер сіз бұл хатты сұрамаған болсаңыз, оны елемеңіз — ештеңе өзгермейді.
executeActionsBodyHtml=<p>IMBC платформасында осы электрондық пошта мекенжайына арналған тіркелгі бар. Кіру үшін төмендегі сілтеме арқылы құпиясөзді орнатыңыз.</p><p><a href="{0}">Құпиясөзді орнату</a></p><p>Сілтеме {4} бойы жарамды. Құпиясөз электрондық пошта арқылы жіберілмейді.</p><p>Егер сіз бұл хатты сұрамаған болсаңыз, оны елемеңіз — ештеңе өзгермейді.</p>

passwordResetSubject=IMBC платформасы: құпиясөзді қалпына келтіру
passwordResetBody=IMBC платформасындағы тіркелгіңіздің құпиясөзін қалпына келтіру сұралды. Жаңа құпиясөз орнату үшін төмендегі сілтемені ашыңыз.\n\n{0}\n\nСілтеме {3} бойы жарамды. Құпиясөз электрондық пошта арқылы жіберілмейді.\n\nЕгер сіз құпиясөзді қалпына келтіруді сұрамаған болсаңыз, бұл хатты елемеңіз — құпиясөзіңіз өзгермейді.
passwordResetBodyHtml=<p>IMBC платформасындағы тіркелгіңіздің құпиясөзін қалпына келтіру сұралды. Жаңа құпиясөз орнату үшін төмендегі сілтемені ашыңыз.</p><p><a href="{0}">Құпиясөзді қалпына келтіру</a></p><p>Сілтеме {3} бойы жарамды. Құпиясөз электрондық пошта арқылы жіберілмейді.</p><p>Егер сіз құпиясөзді қалпына келтіруді сұрамаған болсаңыз, бұл хатты елемеңіз — құпиясөзіңіз өзгермейді.</p>

emailVerificationSubject=IMBC платформасы: электрондық пошта мекенжайын растаңыз
