# Тема писем IMBC: письма, которые отправляет сам Keycloak для NOT-01 (регистрация, приглашение, сброс пароля).
# Ключи те же, что в messages_en.properties (английский — источник, LANG-02). Перевод строки — \n (одна косая
# черта, не \\n); апостроф — ''; срок ссылки подставляет Keycloak (параметры и единицы — в английском файле).
# Единицы срока — формат choice: форма слова зависит от числа (1 день, 2–4 дня, 5–20 дней, 21 день…), до 100.

executeActionsSubject=Платформа IMBC: установите пароль
executeActionsBody=Для этого адреса электронной почты есть учётная запись на платформе IMBC. Чтобы войти, установите пароль по ссылке ниже.\n\n{0}\n\nСсылка действует {4}. Пароль по электронной почте не отправляется.\n\nЕсли вы не запрашивали это письмо, проигнорируйте его — ничего не изменится.
executeActionsBodyHtml=<p>Для этого адреса электронной почты есть учётная запись на платформе IMBC. Чтобы войти, установите пароль по ссылке ниже.</p><p><a href="{0}">Установить пароль</a></p><p>Ссылка действует {4}. Пароль по электронной почте не отправляется.</p><p>Если вы не запрашивали это письмо, проигнорируйте его — ничего не изменится.</p>

passwordResetSubject=Платформа IMBC: сброс пароля
passwordResetBody=Для вашей учётной записи на платформе IMBC запрошен сброс пароля. Чтобы задать новый пароль, перейдите по ссылке ниже.\n\n{0}\n\nСсылка действует {3}. Пароль по электронной почте не отправляется.\n\nЕсли вы не запрашивали сброс пароля, проигнорируйте письмо — пароль не изменится.
passwordResetBodyHtml=<p>Для вашей учётной записи на платформе IMBC запрошен сброс пароля. Чтобы задать новый пароль, перейдите по ссылке ниже.</p><p><a href="{0}">Сбросить пароль</a></p><p>Ссылка действует {3}. Пароль по электронной почте не отправляется.</p><p>Если вы не запрашивали сброс пароля, проигнорируйте письмо — пароль не изменится.</p>

emailVerificationSubject=Платформа IMBC: подтвердите адрес электронной почты
emailVerificationBody=Подтвердите адрес электронной почты учётной записи на платформе IMBC — перейдите по ссылке ниже.\n\n{0}\n\nСсылка действует {3}.\n\nЕсли вы не создавали эту учётную запись, проигнорируйте письмо.
emailVerificationBodyHtml=<p>Подтвердите адрес электронной почты учётной записи на платформе IMBC — перейдите по ссылке ниже.</p><p><a href="{0}">Подтвердить адрес электронной почты</a></p><p>Ссылка действует {3}.</p><p>Если вы не создавали эту учётную запись, проигнорируйте письмо.</p>

