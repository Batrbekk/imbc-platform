# IMBC email theme: the emails Keycloak itself sends for NOT-01 (registration, invitation and reset of the password).
# English is the source file (LANG-02); messages_kk and messages_ru carry the same keys.
# Keycloak formats every value with java.text.MessageFormat: write a newline as \n (a single backslash, never \\n),
# write a literal apostrophe as '' and do not put the numeric lifetime in the text.
# Parameters of the base templates (Keycloak 26.4): {0} link, {1} lifetime in minutes (a number, not used),
# {2} realm display name (not used: the platform name is written out), executeActions: {3} actions, {4} lifetime
# formatted by linkExpirationFormatter ("3 days"); passwordReset and emailVerification: {3} lifetime formatted.
# The link lifetime comes from the realm and from the invitation request (72 hours, AUTH-01, NOT-20).

executeActionsSubject=IMBC Platform: set your password
executeActionsBody=An IMBC Platform account exists for this email address. To sign in, set your password using the link below.\n\n{0}\n\nThe link is valid for {4}. The password is never sent by email.\n\nIf you did not request this email, ignore it and nothing will change.
executeActionsBodyHtml=<p>An IMBC Platform account exists for this email address. To sign in, set your password using the link below.</p><p><a href="{0}">Set your password</a></p><p>The link is valid for {4}. The password is never sent by email.</p><p>If you did not request this email, ignore it and nothing will change.</p>

passwordResetSubject=IMBC Platform: reset your password
passwordResetBody=A password reset was requested for your IMBC Platform account. To choose a new password, use the link below.\n\n{0}\n\nThe link is valid for {3}. The password is never sent by email.\n\nIf you did not request a password reset, ignore this email and your password will not change.
passwordResetBodyHtml=<p>A password reset was requested for your IMBC Platform account. To choose a new password, use the link below.</p><p><a href="{0}">Reset your password</a></p><p>The link is valid for {3}. The password is never sent by email.</p><p>If you did not request a password reset, ignore this email and your password will not change.</p>

emailVerificationSubject=IMBC Platform: confirm your email address
emailVerificationBody=Confirm the email address of your IMBC Platform account by opening the link below.\n\n{0}\n\nThe link is valid for {3}.\n\nIf you did not create this account, ignore this email.
emailVerificationBodyHtml=<p>Confirm the email address of your IMBC Platform account by opening the link below.</p><p><a href="{0}">Confirm your email address</a></p><p>The link is valid for {3}.</p><p>If you did not create this account, ignore this email.</p>

# The base templates print this list of actions for {3} of executeActions.
requiredAction.UPDATE_PASSWORD=Set your password
requiredAction.VERIFY_EMAIL=Confirm your email address

# Link lifetime: "<number> <unit>", the unit is formatted with the number (java.text.ChoiceFormat).
linkExpirationFormatter.timePeriodUnit.seconds={0,choice,0#seconds|1#second|1<seconds}
linkExpirationFormatter.timePeriodUnit.minutes={0,choice,0#minutes|1#minute|1<minutes}
linkExpirationFormatter.timePeriodUnit.hours={0,choice,0#hours|1#hour|1<hours}
linkExpirationFormatter.timePeriodUnit.days={0,choice,0#days|1#day|1<days}
