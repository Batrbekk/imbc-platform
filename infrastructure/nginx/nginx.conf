# Единая точка входа dev-стенда (на проде — ingress Kubernetes с теми же правилами, архитектура §6).
# Браузер видит один origin: / — Web UI, /api — NestJS BFF, /kc — Keycloak.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/problem+json image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream web      { server web:3000; keepalive 16; }
  upstream api      { server api:3001; keepalive 16; }
  upstream keycloak { server keycloak:8080; }

  server {
    listen 80;
    server_name _;

    # Файл до 25 МБ (MAX_FILE_BYTES, FILE-01) + запас на multipart.
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }

    # Консоль аккаунта Keycloak — не экран IMBC; почту-логин меняет только администратор IMBC (MAN-05, ADM-05).
    # Регулярное выражение nginx проверяет раньше префикса /kc/; OIDC, login-actions и resources открыты.
    location ~* ^/kc/realms/[^/]+/account(/|$) { return 404; }

    location /kc/ {
      proxy_pass http://keycloak;
      # Keycloak отдаёт крупные заголовки (cookies сессии IdP).
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /nginx-health { access_log off; return 200 "ok\n"; }
  }
}
