# Статика Web UI. Заголовки nosniff, Referrer-Policy и X-Frame-Options ставит edge (nginx.conf, Caddyfile),
# HSTS и Permissions-Policy — только Caddy в Azure; здесь — только CSP и кеширование, чтобы заголовки не дублировались.
server {
  listen 3000;
  server_tokens off;
  root /usr/share/nginx/html;

  # Хешированные файлы Vite: имя меняется с содержимым, поэтому кеш на год. Отсутствующий файл — 404,
  # не index.html (вкладка старше выката).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Любой адрес приложения — index.html: маршруты решает React Router.
  # no-store: браузер не хранит страницу ни в HTTP-кеше, ни (как правило) в back/forward cache, поэтому
  # после выхода «Назад» не показывает страницу прежнего пользователя (NFR-11, ASVS 5.0 V14.3.2).
  # Браузер, который всё же восстановит вкладку из back/forward cache, перезагрузит её (src/lib/bfcache.ts).
  location / {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    try_files $uri /index.html;
  }
}
